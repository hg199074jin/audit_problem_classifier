  "text": "第三条 基层工会经费收支管理应遵循以下原则：（一）遵纪守法原则……（二）经费独立原则。基层工会应……设立工会经费银行账户，实行工会经费独立核算。（三）预算管理原则。基层工会应按照《工会预算管理办法》的要求，将单位各项收支全部纳入预算管理。……第十六条 基层工会应根据国家和全国总工会的有关政策规定以及上级工会的要求，制定年度工会工作计划，依法、真实、完整、合理地编制工会经费年度预算……严禁无预算、超预算使用工会经费。第十七条 基层工会应根据批准的年度预算，积极组织各项收入，合理安排各项支出，并严格按照《工会会计制度》的要求，科学设立和登记会计账簿，准确办理经费收支核算。",
