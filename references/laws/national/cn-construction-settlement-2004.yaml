  "text": "第十三条 工程进度款结算与支付应当符合下列规定：（一）工程进度款结算方式：1.按月结算与支付。即实行按月支付进度款，竣工后清算的办法。合同工期在两个年度以上的工程，在年终进行工程盘点，办理年度结算。2.分段结算与支付。……（二）工程量计算：承包人应当按照合同约定的方法和时间，向发包人提交已完工程量的报告。发包人接到报告后14天内核实已完工程量……第二十一条 工程竣工后，发、承包双方应及时办清工程竣工结算，否则，工程不得交付使用，有关部门不予办理权属登记。",
