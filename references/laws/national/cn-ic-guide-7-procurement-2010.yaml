  "text": "第七条 企业应当建立科学的供应商评估和准入制度，确定合格供应商清单，与选定的供应商签订质量保证协议，建立供应商管理信息系统，对供应商提供物资或劳务的质量、价格、交货及时性、供货条件及其资信、经营状况等进行实时管理和综合评价，根据评价结果对供应商进行合理选择和调整。第八条 企业应当根据市场情况和采购计划合理选择采购方式。大宗采购应当采用招标方式，合理确定招投标的范围、标准、实施程序和评标规则；一般物资或劳务等的采购可以采用询价或定向采购的方式并签订合同协议；小额零星物资或劳务等的采购可以采用直接购买等方式。第九条 企业应当建立采购物资定价机制，采取协议采购、招标采购、谈判采购、询比价采购等多种方式合理确定采购价格，最大限度地减小市场变化对企业采购价格的影响。大宗采购等应当采用招投标方式确定采购价格，其他商品或劳务的采购，应当根据市场行情制定最高采购限价，并对最高采购限价适时调整。第十一条 企业应当建立严格的采购验收制度，确定检验方式，由专门的验收机构或验收人员对采购项目的品种、规格、数量、质量等相关内容进行验收，出具验收证明。涉及大宗和新、特物资采购的，还应进行专业测试。第十三条 企业应当加强采购付款的管理，完善付款流程，明确付款审核人的责任和权力，严格审核采购预算、合同、相关单据凭证、审批程序等相关内容，审核无误后按照合同规定及时办理付款。企业在付款过程中，应当严格审查采购发票的真实性、合法性和有效性。发现虚假发票的，应查明原因，及时报告处理。",
