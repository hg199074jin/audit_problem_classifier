  "text": "第十一条 企业应当遵循诚实信用原则严格履行合同，对合同履行实施有效监控，强化对合同履行情况及效果的检查、分析和验收，确保合同全面有效履行。合同生效后，企业就质量、价款、履行地点等内容与合同对方没有约定或者约定不明确的，可以协议补充；不能达成补充协议的，按照国家相关法律法规、合同有关条款或者交易习惯确定。第十四条 企业财会部门应当根据合同条款审核后办理结算业务。未按合同条款履约的，或应签订书面合同而未签订的，财会部门有权拒绝付款，并及时向企业有关负责人报告。",
