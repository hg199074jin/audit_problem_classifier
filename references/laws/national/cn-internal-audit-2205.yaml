  "text": "第六条 经济责任审计的对象包括：……企业（含金融机构）本级中层主要领导干部，下属全资、控股或占主导地位企业的主要领导干部，以及对经营效益产生重大影响或掌握重要资产的部门和机构的主要领导干部；上级要求以及本单位内部确定的其他重要岗位人员等。第八条 经济责任审计应当根据干部监督管理需要和审计资源等实际情况有计划地进行，对审计对象实行分类管理，科学制定年度审计计划，推进领导干部履行经济责任情况审计全覆盖。",
