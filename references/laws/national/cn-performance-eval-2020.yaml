  "text": "第四条 绩效评价分为单位自评、部门评价和财政评价三种方式。单位自评是指预算部门组织部门本级和所属单位对预算批复的项目绩效目标完成情况进行自我评价。第十一条 单位自评的内容主要包括项目总体绩效目标、各项绩效指标完成情况以及预算执行情况。对未完成绩效目标或偏离绩效目标较大的项目要分析并说明原因，研究提出改进措施。",
