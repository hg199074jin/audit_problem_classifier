  "text": "第三十条 国家出资企业合并、分立、改制、上市，增加或者减少注册资本，发行债券，进行重大投资，为他人提供大额担保，转让重大财产，进行大额捐赠，分配利润，以及解散、申请破产等重大事项，应当遵守法律、行政法规以及企业章程的规定，不得损害出资人和债权人的权益。",
  "applies_if": [
