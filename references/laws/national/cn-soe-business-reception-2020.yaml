  "text": "第七条 国有企业开展商务宴请，不得提供用野生保护动物制作的菜肴，不得提供鱼翅、燕窝等高档菜肴，每次人均最高不得超过600元（含酒水），不得提供高档酒水，白酒每500毫升、红酒每750毫升售价不得超过500元。企业应当根据所在地区实际情况，分级分档确定控制标准，并制定相应的实施细则。第八条 接待对象5人（含）以内，陪餐人数可对等；接待对象超过5人的，超过部分陪餐人数原则上不超过接待对象的二分之一。第九条 国有企业商务宴请应当严格执行清单制度，如实反映招待对象、招待费用等情况。不提供宴请清单的，费用不予报销。",
