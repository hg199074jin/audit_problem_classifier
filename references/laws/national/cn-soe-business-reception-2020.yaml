    "url": null,
    "identifier": "国资发考分规〔2020〕20号，2020年3月印发。第二条适用范围：国家出资的国有独资、国有全资及国有控股企业；第三条明确商务招待对象不包括党政军机关工作人员和国有企业集团总部工作人员。注意：地方另有更严格标准的（如开封市300元/人次）应优先适用地方标准。文本来源为用户政策文件库PDF，未取得在线官方链接",
