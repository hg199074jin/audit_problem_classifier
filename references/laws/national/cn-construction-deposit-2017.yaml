  "text": "第二条 本办法所称建设工程质量保证金是指发包人与承包人在建设工程承包合同中约定，从应付的工程款中预留，用以保证承包人在缺陷责任期内对建设工程出现的缺陷进行维修的资金。缺陷责任期一般为1年，最长不超过2年，由发、承包双方在合同中约定。第七条 发包人应按照合同约定方式预留保证金，保证金总预留比例不得高于工程价款结算总额的3%。合同约定由承包人以银行保函替代预留保证金的，保函金额不得高于工程价款结算总额的3%。第十一条 发包人在接到承包人返还保证金申请后，应于14天内会同承包人按照合同约定的内容进行核实。如无异议，发包人应当按照约定将保证金返还给承包人。",
