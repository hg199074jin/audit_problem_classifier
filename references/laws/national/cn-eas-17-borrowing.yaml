  "text": "第四条 企业发生的借款费用，可直接归属于符合资本化条件的资产的购建或者生产的，应当予以资本化，计入相关资产成本；其他借款费用，应当在发生时根据其发生额确认为费用，计入当期损益。符合资本化条件的资产，是指需要经过相当长时间的购建或者生产活动才能达到预定可使用或者可销售状态的固定资产、投资性房地产和存货等资产。第十二条 购建或者生产符合资本化条件的资产达到预定可使用或者可销售状态时，借款费用应当停止资本化。在符合资本化条件的资产达到预定可使用或者可销售状态之后所发生的借款费用，应当在发生时根据其发生额确认为费用，计入当期损益。",
