  "text": "第四十八条 原始凭证的基本要求是：（一）原始凭证的内容必须具备：凭证的名称；填制凭证的日期；填制凭证单位名称或者填制人姓名；经办人员的签名或者盖章；接受凭证单位名称；经济业务内容；数量、单价和金额。……（三）凡填有大写和小写金额的原始凭证，大写与小写金额必须相符。购买实物的原始凭证，必须有验收证明。支付款项的原始凭证，必须有收款单位和收款人的收款证明。第五十一条 记帐凭证的基本要求是：……（四）除结帐和更正错误的记帐凭证可以不附原始凭证外，其他记帐凭证必须附有原始凭证。",
