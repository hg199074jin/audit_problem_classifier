  "text": "第二条 本办法所称基层医疗卫生机构，包括城市社区卫生服务中心（站）、乡镇卫生院和村卫生室等机构。第七条 拨付给基层医疗卫生机构的转移支付资金，由其作为实施基本药物制度的收入补助，按照《基层医疗卫生机构财务制度》（财社〔2010〕307号）有关规定使用，不得用于基本建设、大型设备购置。拨付给村卫生室的转移支付资金，主要用于乡村医生的收入补助。",
