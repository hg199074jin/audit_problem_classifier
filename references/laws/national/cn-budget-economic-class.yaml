  "text": "302 商品和服务支出：反映单位购买商品和服务的支出，不包括用于购置固定资产、战略性和应急物资储备等资本性支出。（含01办公费、02印刷费、03咨询费、07邮电费、11差旅费、13维修（护）费、14租赁费、15会议费、16培训费等款级科目）303 对个人和家庭的补助：反映政府用于对个人和家庭的补助支出。（含05生活补助、06救济费、07医疗费补助等款级科目）310 资本性支出（基本建设）：含01房屋建筑物购建、02办公设备购置、03专用设备购置、05基础设施建设、06大型修缮、12拆迁补偿等。",
