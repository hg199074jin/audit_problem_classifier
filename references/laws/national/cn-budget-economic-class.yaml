    "identifier": "本对象为《政府收支分类科目》中部门预算支出经济分类部分的速查对象，用于判断支出经济分类归属（如商品服务支出误列对个人和家庭的补助）。科目每年随年度《政府收支分类科目》调整，具体款级科目以当年度版本为准；本对象仅收录类级说明与常用款级科目，不替代年度版本；文本来源为用户政策文件库官方原件；未取得可公开检索的在线官方链接，正式引用前建议再次核对现行文本。",
