  "text": "第二条 本办法所称转移支付资金，是指用于支持各地实施重大公共卫生服务的专项补助资金。实施期限至2027年12月31日，期满前财政部会同国家卫生健康委、国家疾控局，根据有关法律、行政法规和国务院相关规定及工作需要，组织开展绩效评估，根据评估结果确定是否延续补助政策及延续期限。第三条 重大公共卫生服务主要包括纳入国家免疫规划的常规免疫及补充免疫，艾滋病、结核病、血吸虫病、包虫病防控，精神心理疾病综合管理、重大慢性病防控管理模式和适宜技术探索、重点传染病及健康危害因素监测等内容。",
