  "text": "第三条 本办法所称企业国有资产交易行为包括：（一）履行出资人职责的机构、国有及国有控股企业、国有实际控制企业转让其对企业各种形式出资所形成权益的行为（以下称企业产权转让）；（二）国有及国有控股企业、国有实际控制企业增加资本的行为（以下称企业增资）；（三）国有及国有控股企业、国有实际控制企业的重大资产转让行为（以下称企业资产转让）。第十二条 对按照有关法律法规要求必须进行资产评估的产权转让事项，转让方应当委托具有相应资质的评估机构对转让标的进行资产评估，产权转让价格应以经核准或备案的评估结果为基础确定。第三十一条 以下情形的产权转让可以采取非公开协议转让方式：（一）涉及主业处于关系国家安全、国民经济命脉的重要行业和关键领域企业的重组整合……（二）同一国家出资企业及其各级控股企业或实际控制企业之间因实施内部重组整合进行产权转让的，经该国家出资企业审议决策，可以采取非公开协议转让方式。",
