  "text": "第十三条 经人民代表大会批准的预算，非经法定程序，不得调整。各级政府、各部门、各单位的支出必须以经批准的预算为依据，未列入预算的不得支出。第五十七条 各级政府财政部门必须依照法律、行政法规和国务院财政部门的规定，及时、足额地拨付预算支出资金，加强对预算支出的管理和监督。各级政府、各部门、各单位的支出必须按照预算执行，不得虚假列支。第七十二条 各部门、各单位的预算支出应当按照预算科目执行。严格控制不同预算科目、预算级次或者项目间的预算资金的调剂，确需调剂使用的，按照国务院财政部门的规定办理。",
