  "text": "第十一条 政府会计主体应当以实际发生的经济业务或者事项为依据进行会计核算，如实反映各项会计要素的情况和结果，保证会计信息真实可靠。第十七条 政府会计主体应当按照经济业务或者事项的经济实质进行会计核算，不限于以经济业务或者事项的法律形式为依据。",
