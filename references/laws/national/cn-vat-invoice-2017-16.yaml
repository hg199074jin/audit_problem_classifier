  "rule_role": "direct_basis",
  "text": "一、自2017年7月1日起，购买方为企业的，索取增值税普通发票时，应向销售方提供纳税人识别号或统一社会信用代码；销售方为其开具增值税普通发票时，应在“购买方纳税人识别号”栏填写购买方的纳税人识别号或统一社会信用代码。不符合规定的发票，不得作为税收凭证。……二、销售方开具增值税发票时，发票内容应按照实际销售情况如实开具，不得根据购买方要求填开与实际交易不符的内容。",
