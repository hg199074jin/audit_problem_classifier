  "text": "第二十一条 国有资产监督管理机构依照法定程序决定其所出资企业中的国有独资企业、国有独资公司的分立、合并、破产、解散、增减资本、发行公司债券等重大事项。其中，重要的国有独资企业、国有独资公司分立、合并、破产、解散的，应当由国有资产监督管理机构审核后，报本级人民政府批准。第二十四条 所出资企业投资设立的重要子企业的重大事项，需由所出资企业报国有资产监督管理机构批准的，管理办法由国务院国有资产监督管理机构另行制定，报国务院批准。",
