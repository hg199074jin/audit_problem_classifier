  "text": "第十一条 严格落实国有资产投资监督管理有关要求，健全参股投资决策机制，强化投资决策统一管理。参股投资决策权向下授权应当作为重大经营管理事项经党委（党组）前置研究讨论，由董事会或未设董事会的经理层决定，授权的企业管理层级原则上不超过两级。达到一定额度的参股投资，应当纳入“三重一大”范围，由集团公司决策。第十二条 国有企业作为参股股东与其他股东共同出资新设企业，不得对其他股东出资提供垫资……第二十一条 加强无形资产管理，严格规范无形资产使用……不得将字号、经营资质和特许经营权等提供给参股企业使用。",
