  "text": "第二条 医疗服务与保障能力提升补助资金，是指通过共同财政事权转移支付方式安排，用于支持医疗服务与保障能力提升方面的转移支付资金。转移支付资金实施期限至2025年12月31日。第三条（五）医疗保障服务能力建设方面的转移支付资金重点用于各地医保信息化标准化、基金监管、医保支付方式改革、宣传引导、经办管理服务体系建设、药品和医用耗材集中带量采购、医疗服务价格改革、医保目录实施监管等方面工作，不得用于基础设施建设、公用经费、人员工资及津贴补贴等支出。",
