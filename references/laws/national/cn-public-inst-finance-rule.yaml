  "text": "第二十三条 事业单位从财政部门和主管部门取得的有指定项目和用途的专项资金，应当专款专用、单独核算，并按照规定向财政部门或者主管部门报送专项资金使用情况；项目完成后，应当报送专项资金支出决算和使用效果的书面报告，接受财政部门或者主管部门的检查、验收。第二十七条 事业单位应当依法加强各类票据管理，确保票据来源合法、内容真实、使用正确，不得使用虚假票据。",
