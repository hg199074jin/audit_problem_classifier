  "text": "第四条（原则）……坚持从严从简，带头过紧日子，勤俭办一切事业，降低公务活动成本……第十一条 财政部门应当会同有关部门，根据国内差旅、因公临时出国（境）、公务接待、会议、培训等工作特点……制定分地区的公务活动经费开支范围和开支标准。……严格开支范围和标准，严格支出报销审核，不得报销任何超范围、超标准以及与相关公务活动无关的费用。第二十二条 党政机关应当建立国内公务接待审批控制制度，严格执行公函制度，对无公函的公务活动一律不予接待，严禁将非公务活动纳入接待范围。第二十三条 党政机关应当严格执行国内公务接待标准，实行接待费支出总额控制制度。",
