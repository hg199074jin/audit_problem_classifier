  "text": "第三条 本规定所称内部审计，是指对本单位及所属单位财政财务收支、经济活动、内部控制、风险管理实施独立、客观的监督、评价和建议，以促进单位完善治理、实现目标的活动。第十二条 内部审计机构或者履行内部审计职责的内设机构应当按照国家有关规定和本单位的要求，履行下列职责：（一）对本单位及所属单位贯彻落实国家重大政策措施情况进行审计；（二）对本单位及所属单位发展规划、战略决策、重大措施以及年度业务计划执行情况进行审计；（三）对本单位及所属单位财政财务收支进行审计；……（八）对本单位及所属单位内部控制及风险管理情况进行审计。",
