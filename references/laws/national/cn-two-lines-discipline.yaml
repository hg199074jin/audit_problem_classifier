  "text": "第五条 违反规定，擅自设立行政事业性收费项目或者设置罚没处罚的，对直接负责的主管人员和其他直接责任人员给予降级或者撤职处分。第六条 违反规定，擅自变更行政事业性收费或者罚没范围、标准的，对直接负责的主管人员和其他直接责任人员给予记大过处分；情节严重的，给予降级或者撤职处分。",
