  "text": "第七条 禁止利用职权或者职务上的影响谋取私利。不准有下列行为：（一）接受、索取本企业的关联企业、与本企业及其出资企业有业务关系的企业，以及管理和服务对象提供的礼品、礼金、有价证券、虚拟货币等财物，或者约定在离职或者退休后接受；……（八）将企业经济往来中的折扣费、中介费，因企业行为受到有关部门和单位奖励、返还的财物等据为己有或者私分。第八条 禁止违反规定从事营利活动。不准有下列行为：（一）个人或者以他人名义从事营利性经营活动和有偿中介活动；（二）个人直接或者以委托代持、隐名投资等形式在本企业的同类经营企业、关联企业或者与本企业及其出资企业有业务关系的企业投资入股；（三）未经批准或者备案在本企业所出资企业或者其他企业、事业单位、社会团体、中介机构、基金会、国际组织等单位中兼职，或者经批准或者备案兼职，但领取薪酬、奖金、津贴、补贴等额外利益。",
