  "text": "第十五条 资产清查工作内容主要包括单位基本情况清理、账务清理、财产清查和完善制度等。账务清理是指对行政事业单位的各种银行账户、各类库存现金、有价证券、各项资金往来和会计核算科目等基本账务情况进行全面核对和清理。财产清查是指对行政事业单位的各项资产进行全面的清理、核对和查实。行政事业单位对清查出的各种资产盘盈、损失和资金挂账应当按照资产清查要求进行分类，提出相关处理建议。第二十条 对外投资盘盈是指行政事业单位清查出的无账面记载或者反映的单位对外投资。对外投资盘盈，根据对外投资合同（协议）、价值确定依据、情况说明等进行认定。",
