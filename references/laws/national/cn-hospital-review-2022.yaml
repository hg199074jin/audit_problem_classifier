  "text": "总体要求：一、评审结果各等次总得分要求和第二部分得分要求由各省（区、市）卫生健康行政部门确定。二、第二部分分数在整个评审分数的权重占比不低于60%。三、评审结果判定为甲等的，第三部分得分不能低于90%；判定为乙等的，第三部分得分不能低于80%；判定为丙等的，第三部分得分不能低于70%。第一部分：前置要求——评审周期为四年，医院在评审周期内发生一项及以上情形的，延期一年评审。",
