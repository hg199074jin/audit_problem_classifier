  "text": "第十二条 采购人、采购代理机构应当通过发布公告、从省级以上财政部门建立的供应商库中随机抽取或者采购人和评审专家分别书面推荐的方式邀请不少于3家符合相应资格条件的供应商参与竞争性谈判或者询价采购活动。第四十四条 询价采购需求中的技术、服务等要求应当完整、明确，符合相关法律、行政法规和政府采购政策的规定。",
