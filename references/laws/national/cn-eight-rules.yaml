  "text": "八、要厉行勤俭节约，严格遵守廉洁从政有关规定，严格执行住房、车辆配备等有关工作和生活待遇的规定。实施细则（节录）：3.简化接待工作。……不安排超规格套房，一般不安排接见合影，不赠送各类纪念品或土特产，不安排宴请，不上高档菜肴，自助餐也要注意节俭。",
