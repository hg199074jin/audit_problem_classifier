  "text": "三、有序组建医疗联合体。（一）在城市主要组建医疗集团。在设区的市级以上城市，由三级公立医院或者业务能力较强的机构牵头，联合社区卫生服务机构、护理院、专业康复机构等，形成资源共享、分工协作的管理模式。（二）在县域主要组建医疗共同体。重点探索以县级医院为龙头、乡镇卫生院为枢纽、村卫生室为基础的县乡一体化管理，与乡村一体化管理有效衔接。充分发挥县级医院的城乡纽带作用和县域龙头作用，形成县乡村三级医疗卫生机构分工协作机制，构建三级联动的县域医疗服务体系。",
