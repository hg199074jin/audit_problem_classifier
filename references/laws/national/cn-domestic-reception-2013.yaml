  "text": "第十条 接待对象应当按照规定标准自行用餐。确因工作需要，接待单位可以安排工作餐一次，并严格控制陪餐人数。接待对象在10人以内的，陪餐人数不得超过3人；超过10人的，不得超过接待对象人数的三分之一。工作餐应当供应家常菜，不得提供鱼翅、燕窝等高档菜肴和用野生保护动物制作的菜肴，不得提供香烟和高档酒水，不得使用私人会所、高消费餐饮场所。第十四条 接待费报销凭证应当包括财务票据、派出单位公函和接待清单。接待费资金支付应当严格按照国库集中支付制度和公务卡管理有关规定执行。第十六条 接待单位不得超标准接待，不得组织旅游和与公务活动无关的参观，不得组织到营业性娱乐、健身场所活动，不得安排专场文艺演出，不得以任何名义赠送礼金、有价证券、纪念品和土特产品等。",
