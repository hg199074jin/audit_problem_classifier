  "text": "第七条 本规定第二条至第六条规定范围内的各类工程建设项目，包括项目的勘察、设计、施工、监理以及与工程建设有关的重要设备、材料等的采购，达到下列标准之一的，必须进行招标：（一）施工单项合同估算价在200万元人民币以上的；（二）重要设备、材料等货物的采购，单项合同估算价在100万元人民币以上的；（三）勘察、设计、监理等服务的采购，单项合同估算价在50万元人民币以上的；（四）单项合同估算价低于第（一）、（二）、（三）项规定的标准，但项目总投资额在3000万元人民币以上的。",
