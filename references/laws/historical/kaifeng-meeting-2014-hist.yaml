  "text": "第十六条 市直部门在会议结束后应当及时办理报销手续。报销会议费时应当提供会议审批文件、会议通知和实际参会人员签到表、定点饭店等会议服务单位提供的费用原始明细单据、电子结算单等凭证。财务部门应当严格按规定审核会议费开支，对未列入年度会议计划以及超范围、超标准开支的经费不予报销。第十八条 加强会议费管理。严禁市直部门借会议名义组织会餐或安排宴请，严禁套取、虚列会议费用于其他开支和设立账外账，严禁在会议费中列支公务接待费等与会议无关的任何费用。",
