  "text": "为推动县域医疗卫生事业高质量发展，加快推进分级诊疗、实现有序就医，现就加快推进紧密型县域医疗卫生共同体（以下简称医共体）建设提出如下意见。……（总体要求）坚持以人民健康为中心，深入推进县域医疗卫生服务供给侧结构性改革，加快推进医共体建设，构建定位明确、分工协作、运行高效的县域整合型医疗卫生服务体系。",
