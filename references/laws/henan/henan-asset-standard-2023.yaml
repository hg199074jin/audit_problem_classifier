  "text": "第五条 本标准为配置资产的最高限额标准和最低使用年限标准，各单位应当严格落实过“紧日子”的要求，按照厉行节约的原则，结合工作需要在限额内编制预算和配置资产。第六条 本标准包括资产品目、配置数量上限、价格上限、最低使用年限和性能要求等内容。同品目资产均按照本标准执行。资产未达到最低使用年限的，除损毁且无法修复外，原则上不得更新。已达到使用年限仍可以使用的，应当继续使用。第十一条 省级行政事业单位应当严格执行本标准及有关规定，不得超标准配置资产。",
