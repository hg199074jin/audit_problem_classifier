    "identifier": "豫财资〔2023〕238号，2023年10月25日印发。第二条适用范围：省级党政机关及执行政府会计制度的事业单位。开封市市级单位按《开封市市级行政事业单位国有资产配置管理暂行办法》（汴财资〔2023〕216号）第十一条参照本标准执行；文本来源为用户政策文件库官方原件；未取得可公开检索的在线官方链接，正式引用前建议再次核对现行文本。",
