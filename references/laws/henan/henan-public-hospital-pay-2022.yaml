  "text": "为贯彻落实《人力资源社会保障部 财政部 国家卫生健康委 国家医保局 国家中医药局关于深化公立医院薪酬制度改革的指导意见》（人社部发〔2021〕52号）精神，经省政府同意，制定本实施方案。方案要求合理确定并动态调整公立医院薪酬水平，落实公立医院内部分配自主权，健全以公益性为导向的考核评价机制，规范公立医院负责人薪酬，完善薪酬经费保障机制。",
