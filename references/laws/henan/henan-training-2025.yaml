  "text": "二、加强培训计划管理。一是培训活动实施计划管理，各省直部门在编制年初预算时，应制定部门及所属单位的全年培训计划（包括培训名称、目的、对象、内容、时间、地点、参训人数、所需经费及列支渠道等）……纳入部门年初预算，未纳入预算的培训项目一律不得举办。二是严禁安排非必要的出省培训或者未经审批出省培训。……四、优化培训方式。……二是提倡培训方式由“走出去”调整为“请进来”……不得租用高级宾馆。",
