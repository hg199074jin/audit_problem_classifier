  "text": "（二）适用范围。本实施意见适用于各级政府代表国家出资的国有独资及国有控股企业，包括国有企业本部及其所出资的各级独资、控股的子企业，有关部门及下属机构、直属事业单位管理的国有企业。……本实施意见所称工资总额，是指由国有企业在一个会计年度内直接支付给与本企业建立劳动关系的全部职工的劳动报酬总额，包括工资、奖金、津贴、补贴、加班加点工资、特殊情况下支付的工资等。",
