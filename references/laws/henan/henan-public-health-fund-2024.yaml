  "text": "第三条 基本公共卫生服务项目包括0-6岁儿童、孕产妇、老年人、慢病患者等重点人群健康管理、中医药健康管理、居民健康档案管理、健康教育、预防接种服务、地方病防治、职业病防治、农村妇女“两癌”检查等。第十条 转移支付资金采用因素法分配。转移支付资金分配时主要考虑各地实施基本公共卫生服务常住人口数量、国家基础标准、中央和省级分担比例以及绩效等因素。",
