  "text": "第六条 企业经营管理有关人员违反法律法规和企业内部管理规定，未履行或未正确履行职责，发生本办法第七条至第十六条情形造成资产损失以及其他严重不良后果的，应当追究责任。第七条 集团管控方面：（一）所属子企业发生重大违纪违法问题，造成重大资产损失，影响其持续经营能力或造成企业资不抵债、关闭破产、拖巨额债务、职工群体性上访事件等严重不良后果；（二）未履行或未正确履行职责致使集团发生较大资产损失，对生产经营、财务状况产生重大影响；（三）对集团重大风险隐患、内控缺陷等问题失察，或虽发现但没有及时报告、处理，造成重大风险。第八条 购销管理方面：（一）未按照规定订立、履行合同，未履行或未正确履行职责致使合同标的价格明显不公允；（二）交易行为虚假或违规开展“空转”贸易；（三）利用关联交易输送利益；（四）未按规定进行招标或未执行招标结果。",
