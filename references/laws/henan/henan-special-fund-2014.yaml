  "text": "第十五条 专项资金应严格按具体管理办法分配使用，坚持“先定办法、再分资金”。涉及补助个人的专项资金，应建立健全发放手续，实行公示制度，做到公开、公正、透明。第十六条 ……各部门不得从专项资金中安排工作经费。除国家有明确规定外，项目实施单位原则上不得从专项资金中计提项目管理费。专项资金项目管理所需经费纳入部门预算。",
