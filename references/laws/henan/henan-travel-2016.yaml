  "text": "第十五条 伙食补助费按照出差自然（日历）天数计算，省内出差每人每天100元包干使用。省外出差按照财政部发布的相关地区出差伙食补助费标准执行。第十六条 出差人员应当自行用餐。凡由接待单位协助安排用餐的，除接待单位按《党政机关国内公务接待管理规定》安排的一次工作餐外，应当向接待单位交纳伙食费。第十八条 公杂费按出差自然（日历）天数计算，每人每天80元包干使用，不再报销与市内交通（含往返驻地到机场、车站的交通费）、通讯相关的费用支出。第十九条 出差人员由接待单位或其他单位提供交通工具的，应向接待单位或其他单位交纳市内交通费用。出差人员由所在单位免费提供交通工具或租车出行的，应如实申报，公杂费减半发放。第二十四条 财务部门应当严格按规定审核差旅费开支，对未经批准出差以及超范围、超标准开支的费用不予报销。",
