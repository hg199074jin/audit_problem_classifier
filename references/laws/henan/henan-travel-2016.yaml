    "identifier": "豫财行〔2016〕109号，2016年印发。⚠第十八条、第十九条关于公杂费与“免费提供交通工具减半发放”的口径已被《河南省财政厅关于规范差旅伙食费和市内交通费收交管理有关事项的通知》（豫财行〔2019〕108号）调整：公杂费改为市内交通费，免费提供交通工具不再发放。引用市内交通费口径时应使用 HENAN-TRAVEL-2019-108。第三十六条：省直其他事业单位参照本办法执行；文本来源为用户政策文件库官方原件；未取得可公开检索的在线官方链接，正式引用前建议再次核对现行文本。",
