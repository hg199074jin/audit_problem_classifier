  "rule_role": "direct_basis",
  "text": "一、将省直驻村人员生活补助标准由每人每天70元调整至每人每天100元。二、省直驻村人员每人每天增加40元交通补助。三、因补助标准提高增加的经费从单位公用经费中调剂解决。四、以上标准自2017年12月份起执行。《河南省省直机关差旅费管理办法》（豫财行〔2016〕109号）中省直驻村人员补助标准自行废止。",
