  "text": "第十条 企业人工成本由工资总额、社会保险费、福利费、职工教育经费、劳动保护费、住房费用、其他人工成本构成，是支付给全部从业人员的全部劳动报酬。……其增速用人工成本指数……表示。第十一条 人事费用率、劳动分配率……第十五条 各类企业应合理确定年度生产经营预期目标，突出不同考核重点，科学设置工资效益联动指标，形成适合自身特点的科学合理的工资效益联动模式。设置工资效益联动指标，除利润总额或净利润、经济增加值等经济效益指标和劳动生产率指标外，按照企业功能性质定位、不同发展阶段和行业特点，可增加1至2个工资效益联动指标为宜。",
