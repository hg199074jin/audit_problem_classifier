  "text": "第十条 接待住宿应严格执行差旅、会议管理的有关规定。住宿用房以标准间为主，接待省部级干部可以安排普通套间。接待单位不得超标准安排接待住房，不得额外配发洗漱用品。第十二条 接待对象应按规定标准自行用餐，需接待单位协助安排用餐的，接待对象应主动缴纳伙食费。确因工作需要，接待单位可以安排工作餐一次……第十八条 国内公务接待经费实行属地管理，由各级财政部门统筹安排。……严格执行国内公务接待预算制度，合理限定接待费预算总额。",
