  "text": "一、提升基层医务人员薪酬待遇。（一）完善薪酬激励机制。严格落实公益一类财政保障政策，允许基层医疗卫生机构（指政府办乡镇卫生院和社区卫生服务中心／站、村卫生室，下同）突破现行事业单位工资调控水平，自主决定内部绩效工资比例。绩效分配应突出价值导向、业绩导向，多劳多得、同工同酬、优绩优酬。基层医疗卫生机构在当年医疗服务收入扣除成本和提取各项基金后的结余中，可提取60%以上用于增发奖励性绩效工资。",
