  "text": "第二十条 政府委托出资方式下的财政资金实施专户管理、政府以注资国有企业出资方式下的财政资金实施专账管理，以实现政府出资与受托管理机构自有财产的相互独立。第二十二条 政府投资基金应选择在中国境内设立的商业银行进行托管。托管机构依据托管协议负责账户管理、资金清算、资产保管等事务，对投资活动实施动态监管。第二十三条 政府投资基金应设立投资决策委员会，行使项目投资、退出及重大风险处置预案等重大事项决策权。",
