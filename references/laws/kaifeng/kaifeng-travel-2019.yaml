    "url": null,
    "identifier": "汴财行〔2019〕18号，2019年10月28日印发，自2019年11月1日起施行；第八条明确“其他与此相抵触的文件条款自行废止”。本条已取代汴财行〔2017〕18号第十九条“由所在单位免费提供交通工具或租车出行的，公杂费减半发放”的口径，改为不再发放。适用范围为市直单位出差人员；企业参照适用时应说明参照关系。文本来源为用户政策文件库扫描件OCR",
