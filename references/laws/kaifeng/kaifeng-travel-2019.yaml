  "rule_role": "direct_basis",
  "text": "二、将《开封市市直机关差旅费管理办法》（汴财行〔2017〕18号）中“公杂费”调整为“市内交通费”，不再包含通讯费用支出，市内交通费按每人每天80元包干使用。市辖县、祥符区市内交通费按每人每天40元包干使用。出差人员出差期间按规定领取市内交通费。接待单位协助提供交通工具并有收费标准的，出差人员按标准交纳，最高不超过日市内交通费标准；没有收费标准的，每人每半天按照日市内交通费标准的50%交纳。出差人员由所在单位免费提供交通工具或租车出行的，应如实申报，不再发放市内交通费。",
