  "rule_role": "direct_basis",
  "text": "一、全市征收集体土地地上附着物和青苗补偿标准按照本通知附件执行，其补偿标准有行业规定的以行业标准为准。二、对补偿标准没有涵盖到的附着物，原则上可由征地和被征地双方协商确定，协商不成的由各级价格事务评估机构通过评估确定补偿标准。三、大田包干补偿标准为12000元/亩，大田包干包含除构筑物、坟墓、机井、桥涵、水渠、线杆外的所有地上附着物和青苗。八、此标准适用于杞县、通许县、尉氏县、祥符区、龙亭区、顺河回族区、鼓楼区、禹王台区和城乡一体化示范区。九、本通知自发布之日起执行。《开封市人民政府印发关于调整开封市市区国家建设征收集体土地地上附着物补偿标准的通知》（汴政〔2015〕84号）同时废止。",
