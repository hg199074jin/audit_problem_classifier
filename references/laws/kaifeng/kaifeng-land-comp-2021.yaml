    "identifier": "汴政〔2021〕16号，2021年6月30日印发；汴政〔2015〕84号同时废止。附件按建筑物及构筑物、林木及果木、青苗费、过渡费及搬家费四类分列具体标准（如砖木结构房屋600元/平方米、砖混700元/平方米、框架1200元/平方米）；文本来源为用户政策文件库官方原件；未取得可公开检索的在线官方链接，正式引用前建议再次核对现行文本。",
