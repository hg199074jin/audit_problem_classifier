  "text": "一、严格执行岗位津贴补贴政策。要认真落实国家对特殊岗位津贴补贴实行统一管理的规定，任何地区、部门和单位不得自行建立特殊岗位津贴补贴项目，扩大实施范围和提高标准，各地各单位要严格按照国家政策规定的项目、范围和标准执行。二、认真落实与工资相关的福利待遇。要严格执行国家和我省关于福利待遇方面的政策规定……（一）年休假……（三）探亲假……在规定的探亲假期和路程假期内，正常发放基本工资和各项津贴补贴。",
