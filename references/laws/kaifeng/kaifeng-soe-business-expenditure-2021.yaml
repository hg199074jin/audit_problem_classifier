  "text": "第二十一条 企业负责人开展商务活动，宴请标准按每人每次不超过300元（含酒水）控制；企业负责人开展外事活动，宴请标准按每人每次不超过400元（含酒水）控制；其他公务招待活动按照《中共河南省委办公厅、河南省人民政府办公厅关于印发〈河南省党政机关国内公务接待管理办法〉的通知》（豫办〔2014〕36号）执行。宴请不得提供用野生保护动物制作的菜肴，不得提供鱼翅、燕窝等高档菜肴。第二十二条 企业要明确业务招待活动的审批、报销程序。对企业负责人每次业务招待活动实行招待费用总额和人均费用双控管理，严格控制陪同人数。第二十四条 企业负责人业务招待活动所发生的费用应当由相关部门及时结算。业务招待费用报销应当提供内部审核流程、发票以及招待清单，如实反映招待对象、业务招待活动内容、招待费用、陪同人数等情况，不得将业务招待费用以会议、培训、调研等费用的名义虚列、隐匿。第二十八条 企业应结合生产经营特点，参照电信市场资费标准，根据企业负责人岗位要求和履职需要，合理确定通信费用年度预算控制额度，在预算额度内按照财务制度严格规范执行，不得以任何名目为企业负责人发放通信补贴。",
