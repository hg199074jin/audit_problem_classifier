    "identifier": "汴办〔2021〕16号，2021年10月12日印发。第二条适用范围：市管国有独资及国有控股企业；企业负责人指董事长、副董事长、党委书记、党委副书记、总经理、副总经理、监事会主席、纪委书记。注意：宴请标准300元/人次严于国家层面国资发考分规〔2020〕20号的600元/人次，本地规则优先。文本来源为用户政策文件库扫描件OCR，个别字符可能存在识别误差，正式引用前应对照原件",
