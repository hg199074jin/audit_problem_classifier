  "text": "一、资金来源：驻村第一书记市级专项经费是指由市级财政预算安排、专项用于市派驻村第一书记开展帮扶工作的专项经费。每年每名驻村第一书记驻村专项经费2万元，包干使用，超支不补。二、资金使用范围：（一）主要用于支持市派驻村第一书记开展驻村帮扶工作以及改善驻村工作生活条件相关经费支出，包括办公用品支出、招商引资支出、考察培训支出、农村党建工作支出、农村精神文明建设支出、慰问和应急支出、改善农村人居环境支出、改善日常生活条件支出。（二）驻村专项经费不得用于下列支出：第一书记本人驻村期间往返单位所在地和派驻村的交通费和生活补助……",
