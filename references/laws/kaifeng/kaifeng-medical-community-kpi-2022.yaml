  "text": "第一条 为加强紧密型县域医共体绩效考核，建立健全利益调控和激励约束机制，确保紧密型县域医共体各项医保管理政策正确执行，规范医保基金合理使用、收支平衡、略有结余，保障参保人员合法权益，促进医疗保障制度健康可持续发展。考核指标、评分标准与结果运用见原件附表。",
