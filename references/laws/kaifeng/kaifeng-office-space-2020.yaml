  "text": "第十条 党政机关办公用房配置应当严格执行《党政机关办公用房建设标准》等规定，从严核定面积。第十一条 党政机关办公用房配置方式包括调剂、置换、租用和建设。第十二条 使用单位需要配置办公用房的，由机关事务管理部门优先整合现有办公用房资源调剂解决。",
