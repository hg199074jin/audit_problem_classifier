  "text": "第七条 行政事业单位配置规定限额以上资产应当编制年度新增资产配置预算，按程序报市财政局审批。第十一条 市级行政事业单位通用资产配置标准参照《河南省省级行政事业单位通用资产配置标准（2023年版）》（详见附件）执行，并根据国家有关政策、社会经济发展状况、物价水平、财力状况、技术水平以及资产普及程度等因素适时调整和更新。第十二条 行政事业单位资产配置应当严格执行规定的配置标准。无资产配置标准的，应当从严控制，合理配置，避免浪费。",
