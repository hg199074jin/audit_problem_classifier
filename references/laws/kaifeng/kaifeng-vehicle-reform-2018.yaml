  "text": "《开封市国有企业公务用车制度改革实施意见》（汴车改组〔2018〕1号附件2）：市管企业公务用车制度改革按本意见执行；取消一般公务用车，公务活动出行实行社会化，采取报销公务交通费用、适度发放公务交通补贴或其他符合规定的社会化方式保障公务出行，从严配备定向化保障的公务用车。具体补贴标准与发放范围按本意见分档规定执行。",
