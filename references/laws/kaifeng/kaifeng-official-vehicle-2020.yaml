  "text": "第八条 党政机关配备公务用车应当严格执行以下标准：（一）机要通信用车配备价格12万元以内、排气量1.6升（含）以下的轿车或者其他小型客车。（二）应急保障用车和其他按照规定配备的公务用车标准：县（处）级及以下党政机关配备价格16万元以内、排气量1.8升（含）以下的轿车或者其他小型客车……第二十条 党政机关应当建立公务用车管理台账……将公务用车纳入省公务用车主管部门建立的统一的公务用车管理信息系统。第二十一条 党政机关应当建立健全公务用车使用管理制度……严格公务用车使用时间、事由、地点、里程、油耗、费用等信息登记和公示制度。……实行公务用车保险、维修、加油政府集中采购和定点保险、定点维修、定点加油制度，健全公务用车油耗、运行费用单车核算和年度绩效评价制度。",
