  "text": "第十一条 各单位开展培训，应当在开支范围和标准内优先选择党校、行政学院、干部学院、干部网络学院以及组织人事部门认可的干部培训基地（机构）、高校培训分部等其他培训机构承办，原则上不得在市外举办培训。确属特殊情况，必须在市外安排的培训，须报市委组织部批准后进行。第十二条 组织培训的工作人员控制在参训人员数量的10%以内，每期最多不超过10人。第十三条 严禁借培训名义安排公款旅游；严禁借培训名义组织会餐或安排宴请；严禁组织高消费娱乐、健身活动；严禁使用培训费购置电脑、复印机、打印机、传真机等固定资产以及开支与培训无关的其他费用；严禁在培训费中列支公务接待费、会议费；严禁套取培训费设立“小金库”。",
