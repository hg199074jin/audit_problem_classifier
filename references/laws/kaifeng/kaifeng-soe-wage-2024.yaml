  "text": "一、（二）工资总额预算管理的职工范围为与本企业建立劳动关系并由企业直接支付劳动报酬（含生活费）的人员，包括在岗职工、离岗仍保留劳动关系的职工，不包括离退休人员、劳务派遣人员。六、（三）市政府国资委按照国家、河南省和我市收入分配政策有关规定，对备案制和周期预算管理成效进行评估。对连续两年出现超提、超发工资总额或存在重大违规违纪行为的备案制企业，除按规定进行处理外，还将取消其备案制资格，调整为核准制管理；对周期结束后经清算评价认定超提、超发工资总额的周期预算管理企业，将取消周期预算管理资格。",
