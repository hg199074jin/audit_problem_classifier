    "url": null,
    "identifier": "2024年11月14日印发，自印发之日起施行（七、附则）。适用范围（一、（一））：工资总额预算管理的企业范围原则上与财务决算合并报表范围相一致，包括集团总部和所出资控股的各级子企业。本细则确立“超提、超发工资总额”为违规情形并设处理措施，可作为国企工资计提与发放违规的定性依据。文本来源为用户政策文件库扫描件OCR，正式引用前应对照原件",
