  "text": "凡符合行政、人员、业务、药械、财务、绩效、信息等统一管理要求的紧密型县域医共体，由医共体总医院向市医疗保障局书面申请，并经所在地县（区）卫生健康委员会、医疗保障局确认后实施医保基金总额付费。本通知自2022年1月1日起执行。",
