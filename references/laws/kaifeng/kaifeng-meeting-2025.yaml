    "identifier": "汴财规〔2025〕2号，2025年12月30日印发，替代汴政办〔2014〕98号。第二条适用范围：市级党的机关、人大机关、行政机关、政协机关、监察机关、审判机关、检察机关、各人民团体、各民主党派市委和市工商联（市直部门）。注意：2025年12月30日之前发生的会议费仍应按汴政办〔2014〕98号核定；企业参照适用时应说明参照关系。文本来源为用户政策文件库PDF",
