  "text": "第十七条 会议费核算列支。（一）线下会议的费用开支实行综合限额控制，各项费用之间可以调剂使用，在综合限额标准内据实报销，超支不补。综合限额标准如下：一类会议：每人每天460元（其中伙食费100元、住宿费280元、公杂费80元），一类会议所需电子表决（选举）系统租赁费和无工资代表误工费、城市间交通费等不在会议费综合限额之内，根据会议实际支出情况核定；二类会议：每人每天380元（其中伙食费90元、住宿费230元、公杂费60元）；三类会议：每人每天350元（其中伙食费90元、住宿费210元、公杂费50元）；四类会议：每人每天300元（其中伙食费90元、住宿费180元、公杂费30元）。以上标准为会议费限额标准，市直部门应根据本单位业务和经费情况，在会议费限额标准之内，制定满足自身会议需求的会议费综合限额标准。",
