    "identifier": "汴财行〔2017〕18号，2017年11月8日印发。第二条适用范围：市级党的机关、人大机关、行政机关、政协机关、审判机关、检察机关、各人民团体、各民主党派市委和市工商联，以及参照公务员法管理的事业单位。注意：第十八条、第十九条关于“公杂费”及“免费提供交通工具减半发放”的口径已被汴财行〔2019〕18号调整（公杂费改为市内交通费，免费提供交通工具不再发放），引用市内交通费口径时应使用 KAIFENG-TRAVEL-2019。文本来源为用户政策文件库扫描件OCR",
