  "text": "第十八条 公杂费按出差自然(日历)天数计算，每人每天80元包干使用（其中：本市所辖县出差每人每天40元包干使用），不再报销与市内交通（含往返驻地到机场、车站的交通费）、通讯相关的费用支出。第二十条 出差人员应当严格按规定开支差旅费，费用由所在单位承担，不得向下级单位、企业或其他单位转嫁。第二十一条 城市间交通费按乘坐公共交通工具的等级凭据报销……住宿费在标准限额之内凭发票据实报销。伙食补助费按出差目的地的标准报销，在途期间的伙食补助费按当天最后到达目的地的标准报销。公杂费按规定标准报销。未按规定开支差旅费的，超支部分由个人自理。",
