  "text": "二、省内差旅住宿费标准（元/人·天）：省辖市城区——市级480、其他人员330（郑州市上街区执行县城标准）；县城及以下——市级400、其他人员300；开封市城区——其他人员330（市直驻外单位）；郑州市城区——市级480、其他人员380。三、出差人员应当坚持勤俭节约原则，根据职级对应的住宿费标准自行选择宾馆住宿（不分房型），在限额标准内据实报销。",
