  "rule_role": "direct_basis",
  "text": "一、房屋征收工作经费的使用应遵循依法依规、总额控制、合理节俭、据实列支的原则……其中，接待费用支出应严格按照国家有关规定执行，并不得超过列支工作经费总额的5%。个人领取误餐补助标准不得超过公务灶人均补贴标准，领取误餐补助的不再统一安排工作餐。二、房屋征收工作经费列入项目房屋征收总成本……征收工作经费按不超过征收补偿资金总额的4%实行总额控制、据实列支。按上述标准，房屋征收工作经费户均不足10000元的，按10000元/户核定。单个项目列支工作经费原则上不得超过该项目的工作经费总额。",
